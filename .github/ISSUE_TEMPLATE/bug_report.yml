name: Bug Report / Bypass Report
description: Report a bug, malfunction, or unexpected branch guard bypass
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much context as possible.

  - type: dropdown
    id: client
    attributes:
      label: AI Coding Agent Platform
      description: Which client / platform were you using?
      options:
        - DeepSeek Harness (DSH)
        - Claude Code
        - Codex
        - OpenCode
        - Antigravity
        - Pi
        - Standalone CLI / Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Guard & Environment Version
      description: What version of `agents-gitflow-guard` and Node.js are you using?
      placeholder: "agents-gitflow-guard 0.0.25, Node.js v22.14.0, macOS / Ubuntu / Windows"
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Command or Action Attempted
      description: What exact command or tool call did the agent attempt to run?
      placeholder: "git push origin develop"
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Configuration (gitflow-guard.config.json)
      description: Please paste your `gitflow-guard.config.json` content (if using default, state "default").
      placeholder: |
        {
          "branches": {
            "integration": ["develop"]
          }
        }
    validations:
      required: false

  - type: textarea
    id: behavior
    attributes:
      label: Expected vs Actual Behavior
      description: What did you expect to happen, and what actually happened?
      placeholder: "Expected: blocked with deny message. Actual: command was allowed through."
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Error Output
      description: Please paste any relevant logs, terminal output, or audit trail entries.
      render: shell
