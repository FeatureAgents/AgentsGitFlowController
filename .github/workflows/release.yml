name: Release

# 自动发版工作流:
# 1. develop 分支合并 (push 且带版本/CHANGELOG 变更): 自动比对远端 tag，发现新版本即全量校验、自动打 tag、推 npm 与 GitHub Release
# 2. 手动打 v* 标签推送 (push tags): 兜底触发直接校验发布
# 流程: 版本检测 → 全量测试/构建/矩阵验证 → 自动打 tag 并推送 → npm publish (--provenance) → GitHub Release (带 CHANGELOG 提取说明)

on:
  push:
    branches:
      - develop
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm publish --provenance: OIDC token required to generate provenance attestation
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 检出完整 tags 历史以供比对

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Determine release eligibility
        id: check_release
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TARGET_TAG="v${PKG_VERSION}"

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_FROM_REF="${GITHUB_REF_NAME}"
            if [ "$TAG_FROM_REF" != "$TARGET_TAG" ]; then
              echo "::error::Tag ${TAG_FROM_REF} does not match package.json version ${PKG_VERSION}"
              exit 1
            fi
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "need_tag=false" >> "$GITHUB_OUTPUT"
            echo "tag=${TARGET_TAG}" >> "$GITHUB_OUTPUT"
            echo "version=${PKG_VERSION}" >> "$GITHUB_OUTPUT"
            echo "Release triggered by manual tag push: ${TARGET_TAG}"
          else
            # develop 分支 push 事件
            if git rev-parse "$TARGET_TAG" >/dev/null 2>&1; then
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              echo "Tag ${TARGET_TAG} already exists, skipping release."
            else
              echo "should_release=true" >> "$GITHUB_OUTPUT"
              echo "need_tag=true" >> "$GITHUB_OUTPUT"
              echo "tag=${TARGET_TAG}" >> "$GITHUB_OUTPUT"
              echo "version=${PKG_VERSION}" >> "$GITHUB_OUTPUT"
              echo "New version detected on develop: ${TARGET_TAG}, proceeding to release."
            fi
          fi

      - name: Install dependencies
        if: steps.check_release.outputs.should_release == 'true'
        run: npm ci

      - name: Run verification suite
        if: steps.check_release.outputs.should_release == 'true'
        run: |
          npm run typecheck
          npm test
          npm run check:pins
          npm run check:readmes
          npm run build
          npm run verify:matrix

      - name: Create and push Git tag
        if: steps.check_release.outputs.should_release == 'true' && steps.check_release.outputs.need_tag == 'true'
        run: |
          TAG="${{ steps.check_release.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm
        if: steps.check_release.outputs.should_release == 'true'
        # npm Trusted Publishing (OIDC): 发布认证由 GitHub Actions 的 OIDC 短命身份提供，无需 NPM_TOKEN。
        # 前提: 在 npmjs.com 为该包注册 trusted publisher(org=FeatureAgents, repo=AgentsGitFlowController, workflow=release.yml)。
        # npm>=11.5.1 时自动生成 provenance；若未在 npmjs 侧授权 trusted publisher，此处会认证失败。
        run: npm publish --provenance

      - name: Extract Changelog & Create GitHub Release
        if: steps.check_release.outputs.should_release == 'true'
        run: |
          TAG="${{ steps.check_release.outputs.tag }}"
          VERSION="${{ steps.check_release.outputs.version }}"
          node scripts/extract-changelog.mjs "$VERSION" > RELEASE_NOTES.md
          if [ -s RELEASE_NOTES.md ]; then
            gh release create "$TAG" --title "$TAG" --notes-file RELEASE_NOTES.md
          else
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
