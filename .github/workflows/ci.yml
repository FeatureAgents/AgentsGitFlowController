name: CI

# 全球用户正确性: ubuntu / macOS / Windows × Node 22/24 全矩阵回归
on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # 版本锁定一致性: package.json ↔ 双语 README 锁版本示例 ↔ CHANGELOG 小节标题
      - run: npm run check:pins
      - run: npm run build
      # 连续复测矩阵: DSH 逻辑 + Claude Code / Codex / OpenCode / antigravity hook 编码回归
      - run: npm run verify:matrix